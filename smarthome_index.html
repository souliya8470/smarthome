}
function populateTriggerCodeSelect(){
  const tid = document.getElementById('triggerDevice').value;
  const dev = deviceByTuyaId(tid);
  const sel = document.getElementById('triggerCode');
  if (!dev){ sel.innerHTML=''; return; }
  sel.innerHTML = availableCodesFor(dev).map(c => `<option value="${c}">${c}</option>`).join('');
}

function addActionBlock(prefill){
  const defaultDevice = STATE.devices[0];
  const entry = prefill || { targetTuyaId: defaultDevice ? defaultDevice.tuya_device_id : '', };
  STATE.editingActions.push(entry);
  renderActionsContainer();
}
document.getElementById('addActionBtn').addEventListener('click', () => addActionBlock());

function renderActionsContainer(){
  const box = document.getElementById('actionsContainer');
  box.innerHTML = STATE.editingActions.map((entry, i) => actionBlockHtml(entry, i)).join('');
  STATE.editingActions.forEach((entry, i) => {
    const devSel = box.querySelector(`.action-device[data-idx="${i}"]`);
    if (devSel){
      devSel.value = entry.targetTuyaId;
      devSel.addEventListener('change', () => { entry.targetTuyaId = devSel.value; renderActionsContainer(); });
    }
    const removeBtn = box.querySelector(`.action-remove[data-idx="${i}"]`);
    if (removeBtn) removeBtn.addEventListener('click', () => { STATE.editingActions.splice(i,1); renderActionsContainer(); });
    wireActionControls(box, entry, i);
  });
}
function actionBlockHtml(entry, i){
  const dev = deviceByTuyaId(entry.targetTuyaId);
  const deviceOptions = STATE.devices.map(d => `<option value="${d.tuya_device_id}" ${d.tuya_device_id===entry.targetTuyaId?'selected':''}>${escapeHtml(d.name)}</option>`).join('');
  let controlsHtml = '';
  if (dev){
    if (dev.category === 'infrared_ac'){
      controlsHtml = acControlsHtml(i, entry);
    } else {
      const switches = switchCodesFor(dev);
      if (switches.length){
        controlsHtml = switchControlsHtml(i, entry, switches);
      } else {
        controlsHtml = genericControlsHtml(i, entry, dev);
      }
    }
  }
  return `
  <div class="action-block">
    <div class="action-block-head">
      <span>Action ${i+1}</span>
      <button type="button" class="btn btn-ghost btn-danger action-remove" data-idx="${i}">ລຶບ</button>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>ອຸປະກອນເປົ້າໝາຍ</label>
      <select class="action-device" data-idx="${i}">${deviceOptions}</select>
    </div>
    ${controlsHtml}
  </div>`;
}
function switchCodesFor(dev){
  const state = dev.current_state || {};
  return Object.keys(state).filter(k => /^switch(_\d+)?$/.test(k));
}
function switchControlsHtml(i, entry, switches){
  if (!entry.switchValues) entry.switchValues = {};
  return `
  <div class="field">
    <label>ຕິກເລືອກສະວິດທີ່ຢາກໃຊ້ (ເລືອກໄດ້ຫຼາຍໂຕ)</label>
    <div class="switch-grid">
      ${switches.map(code => `
        <label class="switch-chip">
          <input type="checkbox" class="sw-pick" data-idx="${i}" data-code="${code}" ${code in entry.switchValues ? 'checked':''}>
          ${code}
        </label>
      `).join('')}
    </div>
    <div id="swValueRows-${i}" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;"></div>
  </div>`;
}
function acControlsHtml(i, entry){
  if (!entry.ac) entry.ac = { power:'1', temp:24, fan:'', mode:'' };
  return `
  <div class="row2">
    <div class="field">
      <label>ພະລັງງານ</label>
      <select class="ac-power" data-idx="${i}">
        <option value="1" ${entry.ac.power==='1'?'selected':''}>ເປີດ</option>
        <option value="0" ${entry.ac.power==='0'?'selected':''}>ປິດ</option>
      </select>
    </div>
    <div class="field">
      <label>ອຸນຫະພູມ (°C)</label>
      <input type="number" class="ac-temp" data-idx="${i}" min="16" max="30" value="${entry.ac.temp}">
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label>ຄວາມແຮງພັດລົມ</label>
      <select class="ac-fan" data-idx="${i}">
        <option value="">(ບໍ່ປ່ຽນ)</option>
        <option value="0" ${entry.ac.fan==='0'?'selected':''}>ອ່ອນ</option>
        <option value="1" ${entry.ac.fan==='1'?'selected':''}>ກາງ</option>
        <option value="2" ${entry.ac.fan==='2'?'selected':''}>ແຮງ</option>
        <option value="3" ${entry.ac.fan==='3'?'selected':''}>ແຮງສຸດ</option>
      </select>
    </div>
    <div class="field">
      <label>ໂໝດ</label>
      <select class="ac-mode" data-idx="${i}">
        <option value="">(ບໍ່ປ່ຽນ)</option>
        <option value="0" ${entry.ac.mode==='0'?'selected':''}>ເຢັນ (Cool)</option>
        <option value="1" ${entry.ac.mode==='1'?'selected':''}>ແຫ້ງ (Dry)</option>
        <option value="2" ${entry.ac.mode==='2'?'selected':''}>ພັດລົມ (Fan)</option>
      </select>
    </div>
  </div>
  <div class="hint">ຄວບຄຸມຜ່ານ Smart IR — ຕ້ອງໃຫ້ໂຕຮັບ IR ຢູ່ໃນລະດັບສາຍຕາກົງກັບແອ</div>`;
}
function genericControlsHtml(i, entry, dev){
  if (!entry.generic) entry.generic = { code:'', value:'' };
  return `
  <div class="row2">
    <div class="field">
      <label>dp code</label>
      <input type="text" class="gen-code" data-idx="${i}" placeholder="ເຊັ່ນ switch_1" value="${escapeHtml(entry.generic.code)}">
    </div>
    <div class="field">
      <label>ຄ່າ</label>
      <input type="text" class="gen-value" data-idx="${i}" placeholder="true / 25 / ..." value="${escapeHtml(entry.generic.value)}">
    </div>
  </div>
  <div class="hint">ອຸປະກອນນີ້ຍັງບໍ່ມີຂໍ້ມູນ dp ທີ່ຮູ້ຈັກ — ໃສ່ code/ຄ່າດ້ວຍມືກ່ອນ (ຫຼັງອຸປະກອນສົ່ງ event ຄັ້ງທຳອິດ ລະບົບຈະຮູ້ຈັກເອງ)</div>`;
}
function wireActionControls(box, entry, i){
  box.querySelectorAll(`.sw-pick[data-idx="${i}"]`).forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) entry.switchValues[cb.dataset.code] = true;
      else delete entry.switchValues[cb.dataset.code];
      renderSwitchValueRows(box, entry, i);
    });
  });
  renderSwitchValueRows(box, entry, i);
  const acPower = box.querySelector(`.ac-power[data-idx="${i}"]`);
  if (acPower) acPower.addEventListener('change', () => entry.ac.power = acPower.value);
  const acTemp = box.querySelector(`.ac-temp[data-idx="${i}"]`);
  if (acTemp) acTemp.addEventListener('input', () => entry.ac.temp = acTemp.value);
  const acFan = box.querySelector(`.ac-fan[data-idx="${i}"]`);
  if (acFan) acFan.addEventListener('change', () => entry.ac.fan = acFan.value);
  const acMode = box.querySelector(`.ac-mode[data-idx="${i}"]`);
  if (acMode) acMode.addEventListener('change', () => entry.ac.mode = acMode.value);
  const genCode = box.querySelector(`.gen-code[data-idx="${i}"]`);
  if (genCode) genCode.addEventListener('input', () => entry.generic.code = genCode.value);
  const genValue = box.querySelector(`.gen-value[data-idx="${i}"]`);
  if (genValue) genValue.addEventListener('input', () => entry.generic.value = genValue.value);
}
function renderSwitchValueRows(box, entry, i){
  const holder = box.querySelector(`#swValueRows-${i}`);
  if (!holder) return;
  const codes = Object.keys(entry.switchValues||{});
  holder.innerHTML = codes.map(code => `
    <div style="display:flex; align-items:center; gap:10px; font-size:13.5px;">
      <span style="min-width:90px; color:var(--text-dim);">${code}</span>
      <select class="sw-val" data-idx="${i}" data-code="${code}">
        <option value="true" ${entry.switchValues[code]===true?'selected':''}>ເປີດ</option>
        <option value="false" ${entry.switchValues[code]===false?'selected':''}>ປິດ</option>
      </select>
    </div>
  `).join('');
  holder.querySelectorAll('.sw-val').forEach(sel => {
    sel.addEventListener('change', () => { entry.switchValues[sel.dataset.code] = sel.value === 'true'; });
  });
}

let editingRuleId = null; // null = ສ້າງກົດໃໝ່, ບໍ່ null = ກຳລັງແກ້ໄຂກົດອັນນີ້ຢູ່
function openModal(){
  editingRuleId = null;
  document.getElementById('modalTitle').textContent = 'ສ້າງກົດໃໝ່';
  document.getElementById('ruleName').value = '';
  document.getElementById('triggerValue').value = '';
  setTriggerType('device');
  populateTriggerDeviceSelect();
  STATE.editingActions = [];
  if (STATE.devices.length) addActionBlock();
  else renderActionsContainer();
  document.getElementById('overlay').classList.add('show');
}
function commandToEntry(action){
  const dev = STATE.devices.find(d => d.id === action.target_device_id);
  const entry = { targetTuyaId: dev ? dev.tuya_device_id : '' };
  const cmd = action.command || {};
  if (cmd.type === 'ac'){
    entry.ac = { power:'', temp:'', fan:'', mode:'' };
    (cmd.commands||[]).forEach(c => {
      if (c.code === 'power') entry.ac.power = String(c.value);
      else if (c.code === 'temp') entry.ac.temp = c.value;
      else if (c.code === 'fan') entry.ac.fan = String(c.value);
      else if (c.code === 'mode') entry.ac.mode = String(c.value);
    });
  } else if (cmd.type === 'switch'){
    entry.switchValues = {};
    (cmd.codes||[]).forEach(c => { entry.switchValues[c.code] = c.value; });
  } else if (cmd.type === 'generic'){
    const c = (cmd.codes||[])[0] || { code:'', value:'' };
    entry.generic = { code: c.code, value: String(c.value) };
  }
  return entry;
}
function openEditModal(rule){
  editingRuleId = rule.id;
  document.getElementById('modalTitle').textContent = 'ແກ້ໄຂກົດ';
  document.getElementById('ruleName').value = rule.name;
  const cfg = rule.trigger_config || {};
  if (rule.trigger_type === 'schedule'){
    setTriggerType('schedule');
    document.getElementById('scheduleTime').value = cfg.time || '19:00';
    document.getElementById('scheduleRepeat').value = cfg.repeat || 'daily';
  } else {
    setTriggerType('device');
    populateTriggerDeviceSelect();
    document.getElementById('triggerDevice').value = cfg.device_tuya_id || '';
    populateTriggerCodeSelect();
    document.getElementById('triggerCode').value = cfg.code || '';
    document.getElementById('triggerOp').value = cfg.op || '==';
    document.getElementById('triggerValue').value = String(cfg.value ?? '');
  }
  const actions = STATE.actions.filter(a => a.rule_id === rule.id);
  STATE.editingActions = actions.map(commandToEntry);
  renderActionsContainer();
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('newRuleBtn').addEventListener('click', openModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id==='overlay') closeModal(); });

document.getElementById('saveRuleBtn').addEventListener('click', async () => {
  const name = document.getElementById('ruleName').value.trim();
  if (!name){ toast('ຕ້ອງໃສ່ຊື່ກົດ', true); return; }
  if (STATE.editingActions.length === 0){ toast('ຕ້ອງມີຢ່າງໜ້ອຍ 1 action', true); return; }

  let trigger_type, trigger_config;
  if (currentTriggerType === 'device'){
    const tid = document.getElementById('triggerDevice').value;
    const code = document.getElementById('triggerCode').value;
    const op = document.getElementById('triggerOp').value;
    const rawVal = document.getElementById('triggerValue').value.trim();
    if (!tid || !code || !rawVal){ toast('ຕ້ອງໃສ່ຂໍ້ມູນ trigger ໃຫ້ຄົບ', true); return; }
    trigger_type = 'device_state';
    trigger_config = { device_tuya_id: tid, code, op, value: parseTriggerValue(rawVal) };
  } else {
    const time = document.getElementById('scheduleTime').value;
    const repeat = document.getElementById('scheduleRepeat').value;
    if (!time){ toast('ຕ້ອງໃສ່ໂມງ', true); return; }
    trigger_type = 'schedule';
    trigger_config = { time, repeat };
  }

  const actionsPayload = [];
  for (const entry of STATE.editingActions){
    const dev = deviceByTuyaId(entry.targetTuyaId);
    if (!dev){ toast('ອຸປະກອນ action ບໍ່ຖືກຕ້ອງ', true); return; }
    let command;
    if (dev.category === 'infrared_ac'){
      const cmds = [];
      if (entry.ac.power !== '') cmds.push({ code:'power', value: Number(entry.ac.power) });
      if (entry.ac.temp !== '') cmds.push({ code:'temp', value: Number(entry.ac.temp) });
      if (entry.ac.fan !== '') cmds.push({ code:'fan', value: Number(entry.ac.fan) });
      if (entry.ac.mode !== '') cmds.push({ code:'mode', value: Number(entry.ac.mode) });
      command = { type:'ac', commands: cmds };
    } else if (entry.switchValues && Object.keys(entry.switchValues).length){
      command = { type:'switch', codes: Object.entries(entry.switchValues).map(([code,value]) => ({code,value})) };
    } else if (entry.generic && entry.generic.code){
      command = { type:'generic', codes: [{ code: entry.generic.code, value: parseTriggerValue(entry.generic.value) }] };
    } else {
      toast('ຕ້ອງຕັ້ງຄ່າ action ໃຫ້ຄົບຢ່າງໜ້ອຍ 1 ອຸປະກອນ', true);
      return;
    }
    actionsPayload.push({ target_device_id: dev.id, command });
  }

  try{
    let ruleId;
    if (editingRuleId){
      const { error: updErr } = await sb.from('automation_rules')
        .update({ name, trigger_type, trigger_config }).eq('id', editingRuleId);
      if (updErr) throw updErr;
      ruleId = editingRuleId;
      const { error: delErr } = await sb.from('automation_actions').delete().eq('rule_id', ruleId);
      if (delErr) throw delErr;
    } else {
      const { data: ruleRow, error: ruleErr } = await sb.from('automation_rules')
        .insert({ name, trigger_type, trigger_config, enabled: true })
        .select().single();
      if (ruleErr) throw ruleErr;
      ruleId = ruleRow.id;
    }

    const rows = actionsPayload.map((a, idx) => ({
      rule_id: ruleId, target_device_id: a.target_device_id, command: a.command,
      delay_seconds: 0, sort_order: idx,
    }));
    const { error: actErr } = await sb.from('automation_actions').insert(rows);
    if (actErr) throw actErr;

    toast(editingRuleId ? 'ແກ້ໄຂກົດແລ້ວ' : 'ບັນທຶກກົດແລ້ວ');
    logActivity((editingRuleId?'ແກ້ໄຂກົດ ':'ສ້າງກົດໃໝ່ ') + name);
    closeModal();
    loadAll();
  }catch(e){
    toast('ບັນທຶກລົ້ມເຫຼວ: ' + (e.message||e), true);
  }
});
function parseTriggerValue(raw){
  if (raw === 'true') return true;
  if (raw === 'false') return false;
  const n = Number(raw);
  if (!Number.isNaN(n) && raw !== '') return n;
  return raw;
}

// ຮັບ realtime ຂອງອຸປະກອນທັງໝົດ (ບໍ່ຈຳກັດແຄ່ໂຕດຽວ) — ພໍ listener/Smart Life/ອື່ນໆ ຂຽນ DB
// ປ່ຽນຄ່າອຸປະກອນໃດກໍຕາມ ໜ້າ grid ຈະອັບເດດເອງທັນທີ ບໍ່ຕ້ອງກົດ ↻. Subscribe ຄັ້ງດຽວຕອນເປີດແອັບ
// (ບໍ່ແມ່ນ timer/polling — ເປັນ push ຈາກ Supabase, ຮັບໄດ້ໂດຍບໍ່ຈຳກັດຈຳນວນອຸປະກອນ).
function subscribeDeviceRealtime(){
  sb.channel('iot_devices_all_live')
    .on('postgres_changes', { event:'*', schema:'public', table:'iot_devices' }, (payload) => {
      try{
        if (payload.eventType === 'DELETE') return;
        const row = payload.new;
        if (!row || EXCLUDED_TUYA_IDS.has(row.tuya_device_id)) return;
        const idx = STATE.devices.findIndex(d => d.id === row.id);
        if (idx >= 0){
          // ບໍ່ສ້າງ object ໃໝ່ (Object.assign({}, ...)) — ອັນນັ້ນທຳລາຍ reference, ເຮັດໃຫ້ໜ້າ
          // ລະອຽດທີ່ເປີດຄ້າງໄວ້ (ອ້າງອີງ object ເກົ່າ) ກັບ grid ຫຼັກ (ໃຊ້ object ໃໝ່) ແຍກກັນ,
          // ໄອຄອນນອກເລີຍບໍ່ອັບເດດ. Mutate ໂຕດຽວກັນເລີຍ ໃຫ້ທຸກບ່ອນທີ່ຖື reference ນີ້ຢູ່ເຫັນຄ່າໃໝ່ນຳກັນ.
          Object.assign(STATE.devices[idx], row);
        } else {
          STATE.devices.push(row);
          STATE.devices.sort((a,b) => a.name.localeCompare(b.name));
        }
        renderRoomTabs();
        renderDeviceGrid();
        if (activeDetailDeviceId && row.id === activeDetailDeviceId && activeDetailLiveUpdate){
          activeDetailLiveUpdate(row);
        }
        if (activeGateSensorRefresh && Object.values(GATE_SENSOR_PAIR).includes(row.tuya_device_id)){
          activeGateSensorRefresh();
        }
      }catch(e){ /* non-fatal */ }
    })
    .subscribe();
}

let bootedOnce = false;
function boot(){
  if (bootedOnce) return; // ກັນ boot() ຮັນຊ້ຳ (login ໃໝ່ຫຼັງ logout ຄືນ ຈະບໍ່ subscribe realtime ຊ້ຳຊ້ອນ)
  bootedOnce = true;
  loadAll().then(subscribeDeviceRealtime);
}

// ຈຸດເລີ່ມຕົ້ນແອັບ — ຕ້ອງ login ກ່ອນຈຶ່ງເລີ່ມໂຫຼດຂໍ້ມູນ (ຄືກັນລະບົບ Sykhai)
(function initAuthGate(){
  const existing = loadSession();
  if (existing){
    CURRENT_USER = existing;
    showApp();
    boot();
  } else {
    showLoginScreen();
  }
})();
