<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home — Sykhai</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    --bg: #14181c;
    --bg-elev: #1b2126;
    --bg-elev-2: #222a30;
    --line: #2c363d;
    --text: #e9edf0;
    --text-dim: #8f9ba3;
    --accent: #e8a33d;
    --accent-dim: #6b5324;
    --accent-text: #1a1408;
    --blue: #5aa9e6;
    --green: #5fb87a;
    --red: #e2685c;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Lao', 'Space Grotesk', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 64px; /* room for bottom tab bar */
  }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 22px 16px 60px; }

  /* ---------- bottom tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background: var(--bg-elev); border-top:1px solid var(--line);
    display:flex; justify-content:center;
  }
  .tabbar-inner{ display:flex; width:100%; max-width:820px; }
  .tabbtn{
    flex:1; border:none; background:transparent; color:var(--text-dim);
    padding:12px 8px 10px; font-family:inherit; font-size:12.5px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .tabbtn .ic{ font-size:19px; }
  .tabbtn.active{ color: var(--accent); }

  header.top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom: 18px; flex-wrap:wrap;}
  header.top h1{ font-family:'Space Grotesk', sans-serif; font-size: 21px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  header.top .sub{ color: var(--text-dim); font-size: 13px; margin-top:3px;}

  .btn{
    appearance:none; border:1px solid var(--line); background: var(--bg-elev-2); color: var(--text);
    padding: 9px 16px; border-radius: var(--radius); font-size: 14px; cursor:pointer;
    font-family: inherit; transition: border-color .15s ease, background .15s ease;
  }
  .btn:hover{ border-color:#3a464e; background:#28323a; }
  .btn-accent{ background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight:600; }
  .btn-accent:hover{ background:#f0ae4c; border-color:#f0ae4c; }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-dim); padding:6px 10px;}
  .btn-ghost:hover{ color:var(--text); background: var(--bg-elev-2); }
  .btn-danger{ color: var(--red); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .icon-btn{
    border:1px solid var(--line); background: var(--bg-elev-2); border-radius:999px; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim); font-size:15px;
    flex-shrink:0;
  }
  .icon-btn:hover{ color:var(--text); border-color:#3a464e; }

  .toolbar{ display:flex; gap:10px; margin-bottom:18px; }

  .empty{ border:1px dashed var(--line); border-radius: var(--radius); padding: 40px 20px; text-align:center; color: var(--text-dim); }
  .empty b{ color: var(--text); display:block; font-size:16px; margin-bottom:6px; font-weight:600;}

  .status-line{ display:flex; align-items:center; gap:8px; color:var(--text-dim); font-size:13px; margin-bottom: 16px;}
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); }
  .dot.off{ background: var(--text-dim); }

  /* ---------- room tabs (home page) ---------- */
  .room-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; -webkit-overflow-scrolling:touch; }
  .room-tabs::-webkit-scrollbar{ display:none; }
  .room-chip{
    flex-shrink:0; border:1px solid var(--line); background: var(--bg-elev); color: var(--text-dim);
    padding:8px 15px; border-radius:999px; font-size:13.5px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .room-chip.active{ background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight:600; }

  /* ---------- device grid ---------- */
  .device-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  @media (min-width:600px){ .device-grid{ grid-template-columns: repeat(3, 1fr); } }

  .device-card{
    background: var(--bg-elev); border:1px solid var(--line); border-radius: 14px; padding:14px;
    display:flex; flex-direction:column; gap:14px; cursor:pointer; position:relative;
    transition: border-color .15s ease;
  }
  .device-card:hover{ border-color:#3a464e; }
  .device-card .card-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .device-card .device-ic{ font-size:26px; }
  .device-card .fav-star{
    position:absolute; top:10px; right:10px; background:transparent; border:none; color: var(--text-dim);
    font-size:15px; cursor:pointer; padding:2px;
  }
  .device-card .fav-star.on{ color: var(--accent); }
  .device-card .name{ font-size:13.5px; font-weight:600; line-height:1.3; }
  .device-card .room-tag{ font-size:11.5px; color: var(--text-dim); margin-top:2px; }
  .device-card .reading{ font-size:12px; color: var(--text-dim); margin-top:2px; }
  .device-card .card-bottom{ display:flex; justify-content:flex-end; }

  .power-toggle{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background: var(--bg-elev-2);
    color: var(--text-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    flex-shrink:0;
  }
  .power-toggle.on{ background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .power-toggle:disabled{ opacity:.4; cursor:wait; }
  .no-power{ width:38px; height:38px; }

  /* ---------- modals (shared) ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(10,13,15,.6); backdrop-filter: blur(2px);
    display:none; align-items:flex-start; justify-content:center; padding: 30px 14px 90px; overflow-y:auto; z-index:70;
  }
  .overlay.show{ display:flex; }
  .modal{ background: var(--bg-elev); border:1px solid var(--line); border-radius: 14px; width: 100%; max-width: 560px; padding: 22px; margin-bottom: 30px; }
  .modal h2{ font-family:'Space Grotesk', sans-serif; font-size:18px; margin:0 0 4px; font-weight:600;}
  .modal .modal-sub{ color:var(--text-dim); font-size:13px; margin-bottom:18px; }
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size:13px; color: var(--text-dim); margin-bottom:6px; }
  .field input[type=text], .field input[type=number], .field input[type=time], .field select{
    width:100%; background: var(--bg); border:1px solid var(--line); color: var(--text);
    padding:9px 11px; border-radius:8px; font-size:14px; font-family:inherit;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--accent); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:480px){ .row2,.row3{ grid-template-columns:1fr; } }
  .divider{ border:none; border-top:1px solid var(--line); margin:18px 0; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top: 20px; }

  /* device detail modal specific */
  .detail-head{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .detail-head .device-ic{ font-size:32px; }
  .switch-list{ display:flex; flex-direction:column; gap:10px; }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--bg); }
  .switch-row .code{ font-size:13.5px; color: var(--text-dim); }

  .switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{ position:absolute; inset:0; background: var(--bg-elev-2); border:1px solid var(--line); border-radius:100px; cursor:pointer; transition: background .15s ease; }
  .switch .slider:before{ content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background: var(--text-dim); border-radius:50%; transition: transform .15s ease, background .15s ease; }
  .switch input:checked + .slider{ background: var(--accent-dim); border-color: var(--accent); }
  .switch input:checked + .slider:before{ transform: translateX(18px); background: var(--accent); }
  .switch input:disabled + .slider{ opacity:.5; cursor:wait; }

  .ac-panel{ text-align:center; }
  .ac-temp-display{ font-family:'Space Grotesk', sans-serif; font-size:56px; font-weight:600; margin: 6px 0 2px; }
  .ac-temp-controls{ display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:22px; }
  .ac-stepper{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background: var(--bg-elev-2);
    color: var(--text); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .ac-stepper:hover{ border-color: var(--accent); color: var(--accent); }
  .ac-row{ display:flex; gap:10px; justify-content:center; margin-bottom:14px; }
  .ac-row .btn{ flex:1; max-width:130px; }
  .ac-row .btn.selected{ border-color: var(--accent); color: var(--accent); }

  .gate-visual{ display:flex; flex-direction:column; align-items:center; padding: 6px 0 4px; }
  .gate-svg-wrap{ width:100%; max-width:280px; margin-bottom:6px; }
  .gate-shutter{ transition: height 0.6s cubic-bezier(.4,0,.2,1); }
  .gate-pct-label{ font-family:'Space Grotesk', sans-serif; font-size:32px; font-weight:700; margin: 4px 0 2px; }
  .gate-status-label{ color: var(--text-dim); font-size:13px; margin-bottom:18px; }
  .gate-status-label.moving{ color: var(--accent); }
  .gate-btn-row{ display:flex; gap:10px; width:100%; margin-bottom:12px; }
  .gate-btn-row .btn{ flex:1; }
  .gate-quick-row{ display:flex; align-items:center; gap:10px; width:100%; }
  .gate-quick-row input[type=number]{ width:70px; text-align:center; }
  .gate-quick-row .btn{ flex:1; }
  .pulse-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--accent); margin-right:6px; animation: pulseblink 1s infinite; }
  @keyframes pulseblink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  /* ---------- rule builder page (existing) ---------- */
  .trigger-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .trigger-toggle button{ flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color: var(--text-dim); cursor:pointer; font-family:inherit; font-size:13.5px; }
  .trigger-toggle button.active{ border-color: var(--accent); color: var(--accent); background: rgba(232,163,61,.08); }

  .rule-card{ background: var(--bg-elev); border:1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
  .rule-card.disabled{ opacity:.5; }
  .rule-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .rule-name{ font-weight:600; font-size:15.5px; }
  .rule-meta{ color:var(--text-dim); font-size:13px; margin-top:4px; }
  .rule-actions-list{ margin-top:10px; display:flex; flex-direction:column; gap:5px; }
  .rule-action-row{ font-size:13.5px; color:var(--text-dim); display:flex; gap:6px; align-items:center;}
  .rule-action-row .arrow{ color:var(--accent); }
  .rule-controls{ display:flex; gap:6px; align-items:center; flex-shrink:0; }
  .tag{ display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:3px 9px; border-radius:100px; border:1px solid var(--line); color: var(--text-dim); }
  .tag.device{ border-color:#3a5570; color:var(--blue); }
  .tag.schedule{ border-color:#5a5030; color:var(--accent); }

  .action-block{ border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; background: var(--bg); }
  .action-block-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .action-block-head span{ font-size:13px; color:var(--text-dim); font-weight:600; }
  .switch-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .switch-chip{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background: var(--bg-elev-2); font-size:13.5px; cursor:pointer; }
  .switch-chip input{ accent-color: var(--accent); }

  /* ---------- Smart-Life-style switch controls ---------- */
  .big-toggle-wrap{ display:flex; flex-direction:column; align-items:center; padding: 10px 0 6px; }
  .big-toggle{
    width:170px; height:170px; border-radius:22px; border:2px solid var(--line); background: var(--bg-elev-2);
    color: var(--text-dim); font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; letter-spacing:.03em;
    transition: all .15s ease;
  }
  .big-toggle.on{ background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .big-toggle:active{ transform: scale(.97); }
  .big-toggle:disabled{ opacity:.5; cursor:wait; }
  .big-toggle-label{ margin-top:14px; color: var(--text-dim); font-size:13.5px; }

  .gate-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .gate-btn{
    aspect-ratio: 1/1; border-radius:16px; border:1px solid var(--line); background: var(--bg-elev-2);
    color: var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    cursor:pointer; font-family:inherit; font-size:14px;
  }
  .gate-btn .gate-ic{ font-size:30px; color: var(--text-dim); }
  .gate-btn:active{ background: var(--accent-dim); border-color: var(--accent); }
  .gate-btn:active .gate-ic{ color: var(--accent); }

  .bulb-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .bulb-card{
    border:1px solid var(--line); border-radius:14px; padding:16px 8px 12px; background: var(--bg-elev-2);
    display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer;
  }
  .bulb-card .bulb-ic{ font-size:28px; opacity:.4; filter: grayscale(1); transition: all .15s ease; }
  .bulb-card.on .bulb-ic{ opacity:1; filter: none; }
  .bulb-card .bulb-name{ font-size:12.5px; color: var(--text-dim); text-align:center; }
  .bulb-card.on .bulb-name{ color: var(--text); }

  .toast{
    position:fixed; bottom:74px; left:50%; transform:translateX(-50%);
    background: var(--bg-elev-2); border:1px solid var(--line); color: var(--text);
    padding:11px 18px; border-radius:8px; font-size:13.5px; z-index:100; display:none;
  }
  .toast.show{ display:block; }
  .toast.err{ border-color: var(--red); color: var(--red); }

  .page{ display:none; }
  .page.active{ display:block; }
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ PAGE: HOME (device grid) ============ -->
  <div class="page active" id="pageHome">
    <header class="top">
      <div>
        <h1>ອຸປະກອນ</h1>
        <div class="sub">Smart Home — Sykhai</div>
      </div>
      <button class="icon-btn" id="refreshHomeBtn" title="ໂຫຼດຂໍ້ມູນໃໝ່">↻</button>
    </header>

    <div class="status-line" id="homeStatusLine"><span class="dot off"></span><span>ກຳລັງໂຫຼດ...</span></div>

    <div class="room-tabs" id="roomTabs"></div>

    <div id="deviceGrid" class="device-grid"></div>
  </div>

  <!-- ============ PAGE: RULES (automation builder) ============ -->
  <div class="page" id="pageRules">
    <header class="top">
      <div>
        <h1>ຕັ້ງກົດອັດຕະໂນມັດ</h1>
        <div class="sub">Smart Home — ອຸປະກອນ Tuya ທັງໝົດ</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="refreshBtn">↻ ໂຫຼດຂໍ້ມູນໃໝ່</button>
        <button class="btn btn-accent" id="newRuleBtn">+ ສ້າງກົດໃໝ່</button>
      </div>
    </header>

    <div class="status-line" id="statusLine"><span class="dot off"></span><span>ກຳລັງໂຫຼດ...</span></div>

    <div id="rulesContainer"></div>
  </div>

</div>

<!-- bottom tab bar -->
<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tabbtn active" data-page="pageHome"><span class="ic">🏠</span>ອຸປະກອນ</button>
    <button class="tabbtn" data-page="pageRules"><span class="ic">⚙️</span>ຕັ້ງກົດ</button>
  </div>
</div>

<!-- ============ MODAL: device detail ============ -->
<div class="overlay" id="deviceOverlay">
  <div class="modal" id="deviceModal"></div>
</div>

<!-- ============ MODAL: create/edit rule ============ -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">ສ້າງກົດໃໝ່</h2>

    <div class="field">
      <label>ຊື່ກົດ</label>
      <input type="text" id="ruleName" placeholder="ເຊັ່ນ: ປະຕູຮົ້ວເປີດ → ໄຟ+ແອ">
    </div>

    <div class="field">
      <label>Trigger — ໃຫ້ກົດນີ້ຮັນເມື່ອໃດ</label>
      <div class="trigger-toggle">
        <button type="button" id="triggerDeviceBtn" class="active">📟 ເມື່ອອຸປະກອນ</button>
        <button type="button" id="triggerScheduleBtn">🕒 ຕາມເວລາ</button>
      </div>
    </div>

    <div id="triggerDeviceBlock">
      <div class="field">
        <label>ອຸປະກອນ trigger</label>
        <select id="triggerDevice"></select>
      </div>
      <div class="row3">
        <div class="field">
          <label>ຄ່າ (dp code)</label>
          <select id="triggerCode"></select>
        </div>
        <div class="field">
          <label>ເງື່ອນໄຂ</label>
          <select id="triggerOp">
            <option value="==">ເທົ່າກັບ (==)</option>
            <option value=">">ຫຼາຍກວ່າ (&gt;)</option>
            <option value="<">ໜ້ອຍກວ່າ (&lt;)</option>
            <option value=">=">ຫຼາຍກວ່າ ຫຼື ເທົ່າ</option>
            <option value="<=">ໜ້ອຍກວ່າ ຫຼື ເທົ່າ</option>
          </select>
        </div>
        <div class="field">
          <label>ຄ່າທີ່ປຽບທຽບ</label>
          <input type="text" id="triggerValue" placeholder="true / 30 / ...">
        </div>
      </div>
    </div>

    <div id="triggerScheduleBlock" style="display:none;">
      <div class="row2">
        <div class="field">
          <label>ໂມງ</label>
          <input type="time" id="scheduleTime" value="19:00">
        </div>
        <div class="field">
          <label>ຊ້ຳທຸກ</label>
          <select id="scheduleRepeat">
            <option value="daily">ທຸກມື້</option>
            <option value="once">ຄັ້ງດຽວ (ມື້ນີ້)</option>
          </select>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="field" style="margin-bottom:10px;">
      <label style="margin-bottom:0;">Actions — ໃຫ້ເຮັດຫຍັງແດ່</label>
    </div>
    <div id="actionsContainer"></div>
    <button class="btn" id="addActionBtn" type="button">+ ເພີ່ມ Action</button>

    <div class="modal-actions">
      <button class="btn" id="cancelBtn" type="button">ຍົກເລີກ</button>
      <button class="btn btn-accent" id="saveRuleBtn" type="button">ບັນທຶກກົດ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

async function loadAll(){
  setStatus(false, 'ກຳລັງໂຫຼດ...');
  try{
    const [devRes, ruleRes, actRes] = await Promise.all([
      sb.from('iot_devices').select('id,tuya_device_id,name,category,room,is_favorite,current_state,is_online,last_seen_at').order('name'),
      sb.from('automation_rules').select('*').order('created_at', { ascending:false }),
      sb.from('automation_actions').select('*').order('sort_order'),
    ]);
    if (devRes.error) throw devRes.error;
    if (ruleRes.error) throw ruleRes.error;
    if (actRes.error) throw actRes.error;

    STATE.devices = (devRes.data||[]).filter(d => !EXCLUDED_TUYA_IDS.has(d.tuya_device_id));
    STATE.rules = ruleRes.data || [];
    STATE.actions = actRes.data || [];

    renderRoomTabs();
    renderDeviceGrid();
    renderRules();
    const msg = `ໂຫຼດແລ້ວ — ${STATE.devices.length} ອຸປະກອນ, ${STATE.rules.length} ກົດ`;
    setStatus(true, msg);
  }catch(e){
    setStatus(false, 'ໂຫຼດຂໍ້ມູນລົ້ມເຫຼວ');
    toast('ໂຫຼດຂໍ້ມູນລົ້ມເຫຼວ: ' + (e.message||e), true);
  }
}
function setStatus(ok, text){
  const homeText = `<span class="dot ${ok?'':'off'}"></span><span>${text}</span>`;
  document.getElementById('homeStatusLine').innerHTML = homeText;
  document.getElementById('statusLine').innerHTML = homeText;
}
document.getElementById('refreshHomeBtn').addEventListener('click', loadAll);
document.getElementById('refreshBtn').addEventListener('click', loadAll);

function categoryIcon(cat){
  const map = { kg:'💡', tdq:'🚪', mcs:'🔒', dlq:'⚡', infrared_ac:'❄️', wnykq:'📡', hwktwkq:'📡' };
  return map[cat] || '🔌';
}
function primarySwitches(dev){
  const state = dev.current_state || {};
  return Object.keys(state).filter(k => /^switch(_\d+)?$/.test(k)).sort();
}
function isPulseSwitch(dev){
  // ໂຕ relay ແບບ "ກົດ" (ຄືປຸ່ມ remote) ບໍ່ຄ້າງສະຖານະ — Tuya ຮາຍງານ switch_type: "button"
  return !!(dev.current_state && dev.current_state.switch_type === 'button');
}
function isControllable(dev){
  return dev.category === 'infrared_ac' || primarySwitches(dev).length > 0;
}
function readingText(dev){
  const s = dev.current_state || {};
  const parts = [];
  if (typeof s.temp_current === 'number') parts.push((s.temp_current/10).toFixed(1) + '°C');
  if (typeof s.humidity_current === 'number') parts.push(s.humidity_current + '%');
  if (typeof s.va_temperature === 'number') parts.push((s.va_temperature/10).toFixed(1) + '°C');
  if (typeof s.cur_power === 'number') parts.push((s.cur_power/10).toFixed(1) + 'W');
  if (s.doorcontact_state !== undefined) parts.push(s.doorcontact_state ? 'ເປີດ' : 'ປິດ');
  return parts.join(' · ');
}

function roomList(){
  const rooms = Array.from(new Set(STATE.devices.map(d => d.room).filter(Boolean)));
  rooms.sort();
  return ['ທັງໝົດ', 'ໜ້າດ່ວນ', ...rooms];
}
function renderRoomTabs(){
  const box = document.getElementById('roomTabs');
  const rooms = roomList();
  if (!rooms.includes(STATE.currentRoom)) STATE.currentRoom = 'ທັງໝົດ';
  box.innerHTML = rooms.map(r => `<button class="room-chip ${r===STATE.currentRoom?'active':''}" data-room="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join('');
  box.querySelectorAll('.room-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      STATE.currentRoom = chip.dataset.room;
      renderRoomTabs();
      renderDeviceGrid();
    });
  });
}

function renderDeviceGrid(){
  const grid = document.getElementById('deviceGrid');
  let list = STATE.devices;
  if (STATE.currentRoom === 'ໜ້າດ່ວນ') list = list.filter(d => d.is_favorite);
  else if (STATE.currentRoom !== 'ທັງໝົດ') list = list.filter(d => d.room === STATE.currentRoom);

  if (list.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><b>ບໍ່ມີອຸປະກອນ</b>${STATE.currentRoom==='ໜ້າດ່ວນ' ? 'ກົດຮູບດາວ ⭐ ຢູ່ອຸປະກອນທີ່ຢາກປັກໝຸດໄວ້ໜ້ານີ້' : 'ບໍ່ມີອຸປະກອນໃນໝວດນີ້'}</div>`;
    return;
  }

  grid.innerHTML = list.map(dev => {
    const isGate4ch = !!GATE_4CH_LABELS[dev.tuya_device_id];
    const pulse = isPulseSwitch(dev);
    const controllable = isControllable(dev) && !isGate4ch; // ປະຕູ 4-ຊ່ອງ: ໃຫ້ກົດເຂົ້າໜ້າລະອຽດແທນ, ບໍ່ໃຊ້ປຸ່ມດ່ວນ
    const switches = primarySwitches(dev);
    const mainOn = pulse ? false : (dev.category === 'infrared_ac'
      ? (dev.current_state && dev.current_state.power == 1)
      : (switches.length ? !!(dev.current_state||{})[switches[0]] : false));
    const reading = readingText(dev);
    return `
    <div class="device-card" data-tid="${dev.tuya_device_id}">
      <button class="fav-star ${dev.is_favorite?'on':''}" data-tid="${dev.tuya_device_id}">${dev.is_favorite?'★':'☆'}</button>
      <div class="card-top">
        <div class="device-ic">${categoryIcon(dev.category)}</div>
      </div>
      <div>
        <div class="name">${escapeHtml(dev.name)}</div>
        <div class="room-tag">${escapeHtml(dev.room || 'ບໍ່ໄດ້ຈັດຫ້ອງ')}</div>
        ${reading ? `<div class="reading">${escapeHtml(reading)}</div>` : ''}
      </div>
      <div class="card-bottom">
        ${controllable
          ? `<button class="power-toggle ${mainOn?'on':''}" data-tid="${dev.tuya_device_id}" data-quick="1" data-pulse="${pulse?'1':'0'}">⏻</button>`
          : `<span class="no-power"></span>`}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.device-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.fav-star') || e.target.closest('.power-toggle')) return;
      openDeviceDetail(card.dataset.tid);
    });
  });
  grid.querySelectorAll('.fav-star').forEach(star => {
    star.addEventListener('click', async (e) => {
      e.stopPropagation();
      const dev = deviceByTuyaId(star.dataset.tid);
      const newVal = !dev.is_favorite;
      star.textContent = newVal ? '★' : '☆';
      star.classList.toggle('on', newVal);
      dev.is_favorite = newVal;
      const { error } = await sb.from('iot_devices').update({ is_favorite: newVal }).eq('id', dev.id);
      if (error){ toast('ອັບເດດລົ້ມເຫຼວ', true); return; }
      if (STATE.currentRoom === 'ໜ້າດ່ວນ') renderDeviceGrid();
    });
  });
  grid.querySelectorAll('.power-toggle[data-quick]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const dev = deviceByTuyaId(btn.dataset.tid);
      await quickToggle(dev, btn);
    });
  });
}

function statusValue(deviceStatus, code, fallback){
  if (!Array.isArray(deviceStatus)) return fallback;
  const found = deviceStatus.find(s => s.code === code);
  return found ? found.value : fallback;
}

async function quickToggle(dev, btnEl){
  btnEl.disabled = true;
  const pulse = btnEl.dataset.pulse === '1';
  const switches = primarySwitches(dev);
  const code = switches[0] || 'switch_1';
  try{
    if (pulse){
      await callDeviceCommand(dev.tuya_device_id, [{ code, value: true }]);
      toast('ສົ່ງຄຳສັ່ງແລ້ວ');
    } else if (dev.category === 'infrared_ac'){
      const turningOn = !btnEl.classList.contains('on');
      await callAcCommand(dev.tuya_device_id, [{ code:'power', value: turningOn ? 1 : 0 }]);
      dev.current_state = Object.assign({}, dev.current_state, { power: turningOn ? 1 : 0 });
      btnEl.classList.toggle('on', turningOn);
      toast(turningOn ? 'ເປີດແລ້ວ' : 'ປິດແລ້ວ');
    } else {
      const requestedOn = !btnEl.classList.contains('on');
      const result = await callDeviceCommand(dev.tuya_device_id, [{ code, value: requestedOn }]);
      const confirmedOn = statusValue(result.deviceStatus, code, requestedOn);
      dev.current_state = Object.assign({}, dev.current_state, { [code]: confirmedOn });
      btnEl.classList.toggle('on', !!confirmedOn);
      if (confirmedOn !== requestedOn) toast('⚠️ ອຸປະກອນຕອບຄືນຄ່າຕ່າງຈາກທີ່ສັ່ງ — ອາດຕ້ອງລອງໃໝ່', true);
      else toast(confirmedOn ? 'ເປີດແລ້ວ' : 'ປິດແລ້ວ');
    }
  }catch(e){
    toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true);
  }finally{
    btnEl.disabled = false;
  }
}

async function callDeviceCommand(tuyaDeviceId, commands){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/send-device-command`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
    body: JSON.stringify({ device_id: tuyaDeviceId, commands }),
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.msg || json.error || 'ຄຳສັ່ງລົ້ມເຫຼວ');
  return json;
}
async function callAcCommand(acTuyaDeviceId, commands){
  const res = await fetch(`${SUPABASE_URL}/functions/v1/send-ac-command`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY },
    body: JSON.stringify({ ac_tuya_device_id: acTuyaDeviceId, commands }),
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'ຄຳສັ່ງແອລົ້ມເຫຼວ');
  return json;
}

// ---------- device detail modal ----------
async function openDeviceDetail(tuyaId){
  const dev = deviceByTuyaId(tuyaId);
  if (!dev) return;
  const modal = document.getElementById('deviceModal');
  document.getElementById('deviceOverlay').classList.add('show');

  if (GATE_CONTROL_DEVICES[tuyaId]){
    modal.innerHTML = gateDetailLoadingHtml(dev);
    const [config, state] = await Promise.all([fetchGateConfig(tuyaId), fetchGateState(tuyaId)]);
    modal.innerHTML = gateDetailHtml(dev, config, state);
    wireGateDetail(dev, config, state);
    return;
  }
  if (dev.category === 'infrared_ac'){
    modal.innerHTML = acDetailHtml(dev);
    wireAcDetail(dev);
  } else if (primarySwitches(dev).length){
    modal.innerHTML = switchDetailHtml(dev);
    wireSwitchDetail(dev);
  } else {
    modal.innerHTML = readonlyDetailHtml(dev);
  }
}
function closeDeviceDetail(){ document.getElementById('deviceOverlay').classList.remove('show'); }
document.getElementById('deviceOverlay').addEventListener('click', (e) => { if (e.target.id==='deviceOverlay') closeDeviceDetail(); });

function switchDetailHtml(dev){
  const switches = primarySwitches(dev);
  const state = dev.current_state || {};
  const head = `
    <div class="detail-head">
      <div class="device-ic">${categoryIcon(dev.category)}</div>
      <div>
        <h2 style="margin:0;">${escapeHtml(dev.name)}</h2>
        <div class="modal-sub" style="margin:2px 0 0;">${escapeHtml(dev.room||'ບໍ່ໄດ້ຈັດຫ້ອງ')}</div>
      </div>
    </div>`;
  const footer = `<div class="modal-actions"><button class="btn" id="closeDetailBtn">ປິດ</button></div>`;

  // ຮູບແບບ 1: ປະຕູ 4-ຊ່ອງ ທີ່ຮູ້ຈັກ — grid ປຸ່ມ ເປີດ/ປິດ/ຢຸດ/ລ໋ອກ ຄືກັນ Smart Life
  if (GATE_4CH_LABELS[dev.tuya_device_id]){
    const btns = GATE_4CH_LABELS[dev.tuya_device_id];
    return head + `
      <div class="gate-grid">
        ${btns.map(b => `<button class="gate-btn" data-code="${b.code}"><span class="gate-ic">${b.icon}</span>${b.label}</button>`).join('')}
      </div>
      <div class="hint">ກົດເພື່ອສັ່ງ — ຄືກົດ remote, ບໍ່ຄ້າງສະຖານະ</div>
    ` + footer;
  }

  // ຮູບແບບ 2: switch ດຽວ — ປຸ່ມສີ່ຫຼ່ຽມໃຫຍ່ກາງຈໍ
  if (switches.length === 1){
    const code = switches[0];
    const pulse = isPulseSwitch(dev);
    const on = !!state[code];
    return head + `
      <div class="big-toggle-wrap">
        <button class="big-toggle ${(!pulse && on) ? 'on':''}" data-code="${code}" data-pulse="${pulse?'1':'0'}">${pulse ? 'ກົດ' : (on?'ON':'OFF')}</button>
        <div class="big-toggle-label">${pulse ? 'ກົດເພື່ອສັ່ງ (ບໍ່ຄ້າງສະຖານະ)' : code}</div>
      </div>
    ` + footer;
  }

  // ຮູບແບບ 3: ໄຟຫຼາຍດອກ — ກາດຫຼອດໄຟລຽນກັນ ຄືກັນ Smart Life
  return head + `
    <div class="bulb-grid">
      ${switches.map((code,i) => `
        <div class="bulb-card ${state[code]?'on':''}" data-code="${code}">
          <div class="bulb-ic">💡</div>
          <div class="bulb-name">ດອກ ${i+1}</div>
        </div>`).join('')}
    </div>
  ` + footer;
}

function wireSwitchDetail(dev){
  const modal = document.getElementById('deviceModal');
  const closeBtn = modal.querySelector('#closeDetailBtn');
  if (closeBtn) closeBtn.addEventListener('click', closeDeviceDetail);

  // ຮູບແບບ 1: ປຸ່ມປະຕູ 4-ຊ່ອງ (pulse ຢ່າງດຽວ, ບໍ່ຄ້າງສະຖານະ)
  modal.querySelectorAll('.gate-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try{
        await callDeviceCommand(dev.tuya_device_id, [{ code: btn.dataset.code, value: true }]);
        toast('ສົ່ງຄຳສັ່ງແລ້ວ');
      }catch(e){
        toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true);
      }finally{
        btn.disabled = false;
      }
    });
  });

  // ຮູບແບບ 2: ປຸ່ມສີ່ຫຼ່ຽມໃຫຍ່ (pulse ຫຼື toggle ຕາມປະເພດ)
  const bigBtn = modal.querySelector('.big-toggle');
  if (bigBtn){
    bigBtn.addEventListener('click', async () => {
      const code = bigBtn.dataset.code;
      const pulse = bigBtn.dataset.pulse === '1';
      bigBtn.disabled = true;
      try{
        if (pulse){
          await callDeviceCommand(dev.tuya_device_id, [{ code, value: true }]);
          toast('ສົ່ງຄຳສັ່ງແລ້ວ');
        } else {
          const requestedVal = !bigBtn.classList.contains('on');
          const result = await callDeviceCommand(dev.tuya_device_id, [{ code, value: requestedVal }]);
          const confirmedVal = statusValue(result.deviceStatus, code, requestedVal);
          bigBtn.classList.toggle('on', !!confirmedVal);
          bigBtn.textContent = confirmedVal ? 'ON' : 'OFF';
          dev.current_state = Object.assign({}, dev.current_state, { [code]: confirmedVal });
          renderDeviceGrid();
          if (confirmedVal !== requestedVal) toast('⚠️ ອຸປະກອນຕອບຄືນຄ່າຕ່າງຈາກທີ່ສັ່ງ — ອາດຕ້ອງລອງໃໝ່', true);
          else toast(confirmedVal ? 'ເປີດແລ້ວ' : 'ປິດແລ້ວ');
        }
      }catch(e){
        toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true);
      }finally{
        bigBtn.disabled = false;
      }
    });
  }

  // ຮູບແບບ 3: ກາດຫຼອດໄຟ (toggle)
  modal.querySelectorAll('.bulb-card').forEach(card => {
    card.addEventListener('click', async () => {
      const code = card.dataset.code;
      const requestedVal = !card.classList.contains('on');
      try{
        const result = await callDeviceCommand(dev.tuya_device_id, [{ code, value: requestedVal }]);
        const confirmedVal = statusValue(result.deviceStatus, code, requestedVal);
        card.classList.toggle('on', !!confirmedVal);
        dev.current_state = Object.assign({}, dev.current_state, { [code]: confirmedVal });
        renderDeviceGrid();
        if (confirmedVal !== requestedVal) toast('⚠️ ອຸປະກອນຕອບຄືນຄ່າຕ່າງຈາກທີ່ສັ່ງ — ອາດຕ້ອງລອງໃໝ່', true);
        else toast(confirmedVal ? 'ເປີດແລ້ວ' : 'ປິດແລ້ວ');
      }catch(e){
        toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true);
      }
    });
  });
}

// ປະຕູສະໄລ້ (ຄືປະຕູຮົ້ວນ້ອຍ) — ບານເລື່ອນຂ້າງລະຫວ່າງເສົາ 2 ຕົ້ນ, ເປີດຈາກຊ້າຍຫາຂວາ (ບານຫົດເຂົ້າຫາເສົາຂວາ)
function gateSvgSliding(pct){
  const openWidth = 168;
  const visibleWidth = Math.round(openWidth * (1 - pct/100));
  const panelX = 26 + (openWidth - visibleWidth);
  return `
    <svg viewBox="0 0 220 200" width="100%">
      <defs>
        <clipPath id="gateClip"><rect x="26" y="70" width="${openWidth}" height="100"/></clipPath>
        <pattern id="vbars" width="14" height="100" patternUnits="userSpaceOnUse">
          <rect width="14" height="100" fill="#2b3238"/>
          <rect width="3" height="100" x="5.5" fill="#00000050"/>
        </pattern>
      </defs>
      <rect x="0" y="20" width="220" height="130" fill="#bfe3f5"/>
      <rect x="0" y="150" width="220" height="30" fill="#8fce8f"/>
      <g clip-path="url(#gateClip)">
        <rect id="slidePanel" x="${panelX}" y="70" width="${visibleWidth}" height="100" fill="url(#vbars)"/>
      </g>
      <rect x="14" y="60" width="12" height="120" rx="4" fill="#e8ddc7"/>
      <circle cx="20" cy="58" r="10" fill="#e8ddc7"/>
      <rect x="194" y="60" width="12" height="120" rx="4" fill="#e8ddc7"/>
      <circle cx="200" cy="58" r="10" fill="#e8ddc7"/>
    </svg>`;
}
// ປະຕູມ້ວນ (ຄືປະຕູຮ້ານໃໝ່) — ບານມ້ວນຂຶ້ນເກັບຢູ່ກ່ອງເທິງ
function gateSvgRoller(pct){
  const shutterHeight = Math.round(160 * (1 - pct/100));
  return `
    <svg viewBox="0 0 220 200" width="100%">
      <defs>
        <clipPath id="frameClip"><rect x="20" y="20" width="180" height="160" rx="4"/></clipPath>
        <pattern id="stripes" width="180" height="14" patternUnits="userSpaceOnUse">
          <rect width="180" height="14" fill="#c9902f"/>
          <rect width="180" height="1.5" y="13" fill="#00000030"/>
        </pattern>
      </defs>
      <rect x="20" y="20" width="180" height="160" rx="4" fill="#0d1114" stroke="#3a464e" stroke-width="2"/>
      <rect x="16" y="8" width="188" height="16" rx="3" fill="#3a464e"/>
      <g clip-path="url(#frameClip)">
        <rect id="shutterRect" class="gate-shutter" x="20" y="20" width="180" height="${shutterHeight}" fill="url(#stripes)"/>
      </g>
    </svg>`;
}
function gateSvgFor(gc, pct){
  return gc.type === 'single' ? gateSvgSliding(pct) : gateSvgRoller(pct);

function wireGateDetail(dev, config, state){
  const modal = document.getElementById('deviceModal');
  const gc = GATE_CONTROL_DEVICES[dev.tuya_device_id];
  const closeBtn = modal.querySelector('#closeDetailBtn');
  if (closeBtn) closeBtn.addEventListener('click', closeDeviceDetail);

  let currentPct = state ? (Number(state.position_pct)||0) : 0;

  // ອັບເດດ label ຂໍ້ຄວາມ (ຕົວເລກ % + ສະຖານະ) ບໍ່ແຕະ SVG
  function setLabels(pct, moving, label){
    const pctEl = modal.querySelector('#gatePctLabel'); if (pctEl) pctEl.textContent = pct+'%';
    const statusEl = modal.querySelector('#gateStatusLabel');
    if (statusEl){
      statusEl.className = 'gate-status-label' + (moving?' moving':'');
      statusEl.innerHTML = moving ? '<span class="pulse-dot"></span>ກຳລັງເຄື່ອນທີ່...' : label;
    }
  }
  // ອັບເດດ SVG ແບບ smooth ດ້ວຍ CSS transition ໄລຍະເວລາຈິງ (ບໍ່ jump ທັນທີ)
  function animateGatePanel(targetPct, durationSec){
    const dur = Math.max(0.05, durationSec) + 's';
    if (gc.type === 'single'){
      const openWidth = 168;
      const visibleWidth = Math.round(openWidth * (1 - targetPct/100));
      const panelX = 26 + (openWidth - visibleWidth);
      const panel = modal.querySelector('#slidePanel');
      if (panel){
        panel.style.transition = `x ${dur} linear, width ${dur} linear`;
        panel.setAttribute('x', panelX);
        panel.setAttribute('width', visibleWidth);
      }
    } else {
      const shutterHeight = Math.round(160 * (1 - targetPct/100));
      const rect = modal.querySelector('#shutterRect');
      if (rect){
        rect.style.transition = `height ${dur} linear`;
        rect.setAttribute('height', shutterHeight);
      }
    }
  }

  async function pressOpen(){
    const code = gc.type === '4ch' ? gc.openCode : gc.pressCode;
    await callDeviceCommand(dev.tuya_device_id, [{ code, value:true }]);
  }
  async function pressClose(){
    const code = gc.type === '4ch' ? gc.closeCode : gc.pressCode;
    await callDeviceCommand(dev.tuya_device_id, [{ code, value:true }]);
  }
  async function pressStop(){
    const code = gc.type === '4ch' ? gc.stopCode : gc.pressCode;
    await callDeviceCommand(dev.tuya_device_id, [{ code, value:true }]);
  }

  async function goToPercent(targetPct){
    if (!config){ toast('ບໍ່ພົບ config, ໃຊ້ % ບໍ່ໄດ້', true); return; }
    targetPct = Math.max(0, Math.min(100, Math.round(targetPct)));
    const opening = targetPct > currentPct;
    try{
      await logGateCommand(dev.tuya_device_id);
      if (opening) await pressOpen(); else await pressClose();

      const travelSec = opening ? config.open_travel_seconds : config.close_travel_seconds;
      const fullMs = travelSec * 1000;
      const targetMs = (Math.abs(targetPct - currentPct)/100) * fullMs;

      animateGatePanel(targetPct, targetMs/1000);
      setLabels(targetPct, true, '');
      await updateGateState(dev.tuya_device_id, { direction: opening?'opening':'closing', is_moving:true, command_started_at:new Date().toISOString() });
      toast('ກຳລັງໄປ ' + targetPct + '%...');

      if (targetPct > 0 && targetPct < 100){
        const waitMs = Math.max(0, targetMs - (config.physical_press_delay_ms||0));
        await sleep(waitMs);
        await pressStop();
        await sleep(Math.max(0, targetMs - waitMs));
      } else {
        await sleep(targetMs);
      }
      currentPct = targetPct;
      setLabels(targetPct, false, targetPct>=100?'ເປີດຄ້າງ':(targetPct<=0?'ປິດຄ້າງ':targetPct+'% ຄ້າງ'));
      await updateGateState(dev.tuya_device_id, { position_pct: targetPct, is_moving:false });
      renderDeviceGrid();
    }catch(e){
      toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true);
    }
  }

  if (gc.type === 'single'){
    // relay ດຽວ, ບໍ່ມີ signal ແຍກ open/close — ປຸ່ມດຽວ ສະຫຼັບຕາມສະຖານະປັດຈຸບັນ (ຄືກັນ Marketing Studio)
    const toggleBtn = modal.querySelector('#gateToggleBtn');
    if (toggleBtn) toggleBtn.addEventListener('click', async () => {
      try{
        await logGateCommand(dev.tuya_device_id);
        await pressOpen(); // pressCode ດຽວກັນທັງເປີດ-ປິດ, relay ຕັດສິນທິດທາງເອງ
        const targetPct = currentPct < 50 ? 100 : 0;
        const travelSec = (targetPct>currentPct ? config?.open_travel_seconds : config?.close_travel_seconds) || 26;
        animateGatePanel(targetPct, travelSec);
        setLabels(targetPct, true, '');
        await updateGateState(dev.tuya_device_id, { direction: targetPct>currentPct?'opening':'closing', is_moving:true, command_started_at:new Date().toISOString() });
        toast('ກຳລັງເຄື່ອນທີ່...');
        await sleep(travelSec*1000);
        currentPct = targetPct;
        setLabels(targetPct, false, targetPct>=100?'ເປີດຄ້າງ':'ປິດຄ້າງ');
        await updateGateState(dev.tuya_device_id, { position_pct: targetPct, is_moving:false });
        renderDeviceGrid();
      }catch(e){ toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true); }
    });
  } else {
    modal.querySelector('#gateOpenBtn').addEventListener('click', () => goToPercent(100));
    modal.querySelector('#gateCloseBtn').addEventListener('click', () => goToPercent(0));
    modal.querySelector('#gateStopBtn').addEventListener('click', async () => {
      try{
        await pressStop();
        setLabels(currentPct, false, currentPct+'% ຄ້າງ');
        await updateGateState(dev.tuya_device_id, { is_moving:false });
        toast('ຢຸດແລ້ວ');
      }catch(e){ toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true); }
    });
  }

  const quickBtn = modal.querySelector('#gateQuickBtn');
  if (quickBtn) quickBtn.addEventListener('click', () => goToPercent(Number(config.quick_open_pct)));
  const customBtn = modal.querySelector('#gateCustomBtn');
  if (customBtn) customBtn.addEventListener('click', () => {
    const val = Number(modal.querySelector('#gateCustomPct').value);
    if (!Number.isFinite(val)){ toast('ໃສ່ % ໃຫ້ຖືກຕ້ອງ', true); return; }
    goToPercent(val);
  });
}

function wireAcDetail(dev){
  const modal = document.getElementById('deviceModal');
  modal.querySelector('#closeDetailBtn').addEventListener('click', closeDeviceDetail);
  let temp = (dev.current_state && typeof dev.current_state.temp === 'number') ? dev.current_state.temp : 24;
  let isOn = !!(dev.current_state && dev.current_state.power == 1);
  const powerBtn = modal.querySelector('#acPowerBtn');
  powerBtn.classList.toggle('on', isOn);

  async function sendAc(cmds){
    try{
      await callAcCommand(dev.tuya_device_id, cmds);
      toast('ສົ່ງຄຳສັ່ງແລ້ວ');
    }catch(e){
      toast('ສັ່ງລົ້ມເຫຼວ: ' + (e.message||e), true);
    }
  }

  powerBtn.addEventListener('click', async () => {
    isOn = !isOn;
    powerBtn.classList.toggle('on', isOn);
    dev.current_state = Object.assign({}, dev.current_state, { power: isOn?1:0 });
    await sendAc([{ code:'power', value: isOn?1:0 }]);
    renderDeviceGrid();
  });
  modal.querySelector('#acTempUp').addEventListener('click', async () => {
    temp = Math.min(30, temp+1);
    modal.querySelector('#acTempDisplay').textContent = temp+'°';
    dev.current_state = Object.assign({}, dev.current_state, { temp, power:1 });
    await sendAc([{ code:'temp', value: temp }]);
  });
  modal.querySelector('#acTempDown').addEventListener('click', async () => {
    temp = Math.max(16, temp-1);
    modal.querySelector('#acTempDisplay').textContent = temp+'°';
    dev.current_state = Object.assign({}, dev.current_state, { temp, power:1 });
    await sendAc([{ code:'temp', value: temp }]);
  });
  modal.querySelectorAll('[data-fan]').forEach(b => {
    b.addEventListener('click', async () => {
      modal.querySelectorAll('[data-fan]').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      await sendAc([{ code:'fan', value: Number(b.dataset.fan) }]);
    });
  });
}

function describeTrigger(rule){
  if (rule.trigger_type === 'schedule'){
    const c = rule.trigger_config || {};
    return `🕒 ທຸກ${c.repeat==='once'?'ຄັ້ງດຽວ':'ມື້'} ໂມງ ${c.time||'?'}`;
  }
  const c = rule.trigger_config || {};
  const dev = deviceByTuyaId(c.device_tuya_id);
  return `📟 ${dev ? dev.name : c.device_tuya_id} — ${c.code} ${c.op} ${c.value}`;
}
function describeAction(a){
  const dev = deviceById(a.target_device_id);
  const name = dev ? dev.name : '(ອຸປະກອນຖືກລຶບ)';
  const cmd = a.command || {};
  if (cmd.type === 'ac'){
    const parts = (cmd.commands||[]).map(c => `${c.code}=${c.value}`).join(', ');
    return `${name}: ${parts}`;
  }
  if (cmd.type === 'switch'){
    const parts = (cmd.codes||[]).map(c => `${c.code} → ${c.value?'ເປີດ':'ປິດ'}`).join(', ');
    return `${name}: ${parts}`;
  }
  const parts = (cmd.codes||[]).map(c => `${c.code}=${c.value}`).join(', ');
  return `${name}: ${parts}`;
}
function renderRules(){
  const box = document.getElementById('rulesContainer');
  if (STATE.rules.length === 0){
    box.innerHTML = `<div class="empty"><b>ຍັງບໍ່ມີກົດ</b>ກົດ "+ ສ້າງກົດໃໝ່" ເພື່ອເລີ່ມຕັ້ງອັດຕະໂນມັດ</div>`;
    return;
  }
  box.innerHTML = STATE.rules.map(rule => {
    const actions = STATE.actions.filter(a => a.rule_id === rule.id);
    const tagClass = rule.trigger_type === 'schedule' ? 'schedule' : 'device';
    return `
    <div class="rule-card ${rule.enabled ? '' : 'disabled'}" data-id="${rule.id}">
      <div class="rule-head">
        <div>
          <div class="rule-name">${escapeHtml(rule.name)}</div>
          <div class="rule-meta"><span class="tag ${tagClass}">${describeTrigger(rule)}</span></div>
        </div>
        <div class="rule-controls">
          <label class="switch">
            <input type="checkbox" class="enable-toggle" ${rule.enabled?'checked':''}>
            <span class="slider"></span>
          </label>
          <button class="btn btn-ghost btn-danger delete-rule" title="ລຶບ">🗑</button>
        </div>
      </div>
      <div class="rule-actions-list">
        ${actions.map(a => `<div class="rule-action-row"><span class="arrow">→</span>${escapeHtml(describeAction(a))}</div>`).join('') || '<div class="rule-action-row">(ບໍ່ມີ action)</div>'}
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('.enable-toggle').forEach(el => {
    el.addEventListener('change', async (ev) => {
      const card = ev.target.closest('.rule-card');
      const id = card.dataset.id;
      const { error } = await sb.from('automation_rules').update({ enabled: ev.target.checked }).eq('id', id);
      if (error){ toast('ອັບເດດລົ້ມເຫຼວ', true); ev.target.checked = !ev.target.checked; return; }
      card.classList.toggle('disabled', !ev.target.checked);
      toast(ev.target.checked ? 'ເປີດໃຊ້ກົດແລ້ວ' : 'ປິດກົດແລ້ວ');
    });
  });
  box.querySelectorAll('.delete-rule').forEach(el => {
    el.addEventListener('click', async (ev) => {
      const card = ev.target.closest('.rule-card');
      const id = card.dataset.id;
      const rule = STATE.rules.find(r=>r.id===id);
      if (!confirmModal(`ລຶບກົດ "${rule.name}" ບໍ່?`)) return;
      const { error: e1 } = await sb.from('automation_actions').delete().eq('rule_id', id);
      const { error: e2 } = await sb.from('automation_rules').delete().eq('id', id);
      if (e1 || e2){ toast('ລຶບລົ້ມເຫຼວ', true); return; }
      toast('ລຶບກົດແລ້ວ');
      loadAll();
    });
  });
}

document.getElementById('triggerDeviceBtn').addEventListener('click', () => setTriggerType('device'));
document.getElementById('triggerScheduleBtn').addEventListener('click', () => setTriggerType('schedule'));
let currentTriggerType = 'device';
function setTriggerType(t){
  currentTriggerType = t;
  document.getElementById('triggerDeviceBtn').classList.toggle('active', t==='device');
  document.getElementById('triggerScheduleBtn').classList.toggle('active', t==='schedule');
  document.getElementById('triggerDeviceBlock').style.display = t==='device' ? '' : 'none';
  document.getElementById('triggerScheduleBlock').style.display = t==='schedule' ? '' : 'none';
}
function populateTriggerDeviceSelect(){
  const sel = document.getElementById('triggerDevice');
  sel.innerHTML = STATE.devices.map(d => `<option value="${d.tuya_device_id}">${escapeHtml(d.name)}</option>`).join('');
  sel.onchange = () => populateTriggerCodeSelect();
  populateTriggerCodeSelect();
}
function availableCodesFor(device){
  const state = device.current_state || {};
  const codes = Object.keys(state).filter(k => !k.startsWith('_') && !/^\d+$/.test(k));
  return codes.length ? codes : ['(ຍັງບໍ່ມີຂໍ້ມູນ dp — ລອງ trigger ອຸປະກອນນີ້ຈິງ 1 ຄັ້ງກ່ອນ)'];
}
function populateTriggerCodeSelect(){
  const tid = document.getElementById('triggerDevice').value;
  const dev = deviceByTuyaId(tid);
  const sel = document.getElementById('triggerCode');
  if (!dev){ sel.innerHTML=''; return; }
  sel.innerHTML = availableCodesFor(dev).map(c => `<option value="${c}">${c}</option>`).join('');
}

function addActionBlock(prefill){
  const defaultDevice = STATE.devices[0];
  const entry = prefill || { targetTuyaId: defaultDevice ? defaultDevice.tuya_device_id : '', };
  STATE.editingActions.push(entry);
  renderActionsContainer();
}
document.getElementById('addActionBtn').addEventListener('click', () => addActionBlock());

function renderActionsContainer(){
  const box = document.getElementById('actionsContainer');
  box.innerHTML = STATE.editingActions.map((entry, i) => actionBlockHtml(entry, i)).join('');
  STATE.editingActions.forEach((entry, i) => {
    const devSel = box.querySelector(`.action-device[data-idx="${i}"]`);
    if (devSel){
      devSel.value = entry.targetTuyaId;
      devSel.addEventListener('change', () => { entry.targetTuyaId = devSel.value; renderActionsContainer(); });
    }
    const removeBtn = box.querySelector(`.action-remove[data-idx="${i}"]`);
    if (removeBtn) removeBtn.addEventListener('click', () => { STATE.editingActions.splice(i,1); renderActionsContainer(); });
    wireActionControls(box, entry, i);
  });
}
function actionBlockHtml(entry, i){
  const dev = deviceByTuyaId(entry.targetTuyaId);
  const deviceOptions = STATE.devices.map(d => `<option value="${d.tuya_device_id}" ${d.tuya_device_id===entry.targetTuyaId?'selected':''}>${escapeHtml(d.name)}</option>`).join('');
  let controlsHtml = '';
  if (dev){
    if (dev.category === 'infrared_ac'){
      controlsHtml = acControlsHtml(i, entry);
    } else {
      const switches = switchCodesFor(dev);
      if (switches.length){
        controlsHtml = switchControlsHtml(i, entry, switches);
      } else {
        controlsHtml = genericControlsHtml(i, entry, dev);
      }
    }
  }
  return `
  <div class="action-block">
    <div class="action-block-head">
      <span>Action ${i+1}</span>
      <button type="button" class="btn btn-ghost btn-danger action-remove" data-idx="${i}">ລຶບ</button>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>ອຸປະກອນເປົ້າໝາຍ</label>
      <select class="action-device" data-idx="${i}">${deviceOptions}</select>
    </div>
    ${controlsHtml}
  </div>`;
}
function switchCodesFor(dev){
  const state = dev.current_state || {};
  return Object.keys(state).filter(k => /^switch(_\d+)?$/.test(k));
}
function switchControlsHtml(i, entry, switches){
  if (!entry.switchValues) entry.switchValues = {};
  return `
  <div class="field">
    <label>ຕິກເລືອກສະວິດທີ່ຢາກໃຊ້ (ເລືອກໄດ້ຫຼາຍໂຕ)</label>
    <div class="switch-grid">
      ${switches.map(code => `
        <label class="switch-chip">
          <input type="checkbox" class="sw-pick" data-idx="${i}" data-code="${code}" ${code in entry.switchValues ? 'checked':''}>
          ${code}
        </label>
      `).join('')}
    </div>
    <div id="swValueRows-${i}" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;"></div>
  </div>`;
}
function acControlsHtml(i, entry){
  if (!entry.ac) entry.ac = { power:'1', temp:24, fan:'', mode:'' };
  return `
  <div class="row2">
    <div class="field">
      <label>ພະລັງງານ</label>
      <select class="ac-power" data-idx="${i}">
        <option value="1" ${entry.ac.power==='1'?'selected':''}>ເປີດ</option>
        <option value="0" ${entry.ac.power==='0'?'selected':''}>ປິດ</option>
      </select>
    </div>
    <div class="field">
      <label>ອຸນຫະພູມ (°C)</label>
      <input type="number" class="ac-temp" data-idx="${i}" min="16" max="30" value="${entry.ac.temp}">
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label>ຄວາມແຮງພັດລົມ</label>
      <select class="ac-fan" data-idx="${i}">
        <option value="">(ບໍ່ປ່ຽນ)</option>
        <option value="0" ${entry.ac.fan==='0'?'selected':''}>ອ່ອນ</option>
        <option value="1" ${entry.ac.fan==='1'?'selected':''}>ກາງ</option>
        <option value="2" ${entry.ac.fan==='2'?'selected':''}>ແຮງ</option>
        <option value="3" ${entry.ac.fan==='3'?'selected':''}>ແຮງສຸດ</option>
      </select>
    </div>
    <div class="field">
      <label>ໂໝດ</label>
      <select class="ac-mode" data-idx="${i}">
        <option value="">(ບໍ່ປ່ຽນ)</option>
        <option value="0" ${entry.ac.mode==='0'?'selected':''}>ເຢັນ (Cool)</option>
        <option value="1" ${entry.ac.mode==='1'?'selected':''}>ແຫ້ງ (Dry)</option>
        <option value="2" ${entry.ac.mode==='2'?'selected':''}>ພັດລົມ (Fan)</option>
      </select>
    </div>
  </div>
  <div class="hint">ຄວບຄຸມຜ່ານ Smart IR — ຕ້ອງໃຫ້ໂຕຮັບ IR ຢູ່ໃນລະດັບສາຍຕາກົງກັບແອ</div>`;
}
function genericControlsHtml(i, entry, dev){
  if (!entry.generic) entry.generic = { code:'', value:'' };
  return `
  <div class="row2">
    <div class="field">
      <label>dp code</label>
      <input type="text" class="gen-code" data-idx="${i}" placeholder="ເຊັ່ນ switch_1" value="${escapeHtml(entry.generic.code)}">
    </div>
    <div class="field">
      <label>ຄ່າ</label>
      <input type="text" class="gen-value" data-idx="${i}" placeholder="true / 25 / ..." value="${escapeHtml(entry.generic.value)}">
    </div>
  </div>
  <div class="hint">ອຸປະກອນນີ້ຍັງບໍ່ມີຂໍ້ມູນ dp ທີ່ຮູ້ຈັກ — ໃສ່ code/ຄ່າດ້ວຍມືກ່ອນ (ຫຼັງອຸປະກອນສົ່ງ event ຄັ້ງທຳອິດ ລະບົບຈະຮູ້ຈັກເອງ)</div>`;
}
function wireActionControls(box, entry, i){
  box.querySelectorAll(`.sw-pick[data-idx="${i}"]`).forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) entry.switchValues[cb.dataset.code] = true;
      else delete entry.switchValues[cb.dataset.code];
      renderSwitchValueRows(box, entry, i);
    });
  });
  renderSwitchValueRows(box, entry, i);
  const acPower = box.querySelector(`.ac-power[data-idx="${i}"]`);
  if (acPower) acPower.addEventListener('change', () => entry.ac.power = acPower.value);
  const acTemp = box.querySelector(`.ac-temp[data-idx="${i}"]`);
  if (acTemp) acTemp.addEventListener('input', () => entry.ac.temp = acTemp.value);
  const acFan = box.querySelector(`.ac-fan[data-idx="${i}"]`);
  if (acFan) acFan.addEventListener('change', () => entry.ac.fan = acFan.value);
  const acMode = box.querySelector(`.ac-mode[data-idx="${i}"]`);
  if (acMode) acMode.addEventListener('change', () => entry.ac.mode = acMode.value);
  const genCode = box.querySelector(`.gen-code[data-idx="${i}"]`);
  if (genCode) genCode.addEventListener('input', () => entry.generic.code = genCode.value);
  const genValue = box.querySelector(`.gen-value[data-idx="${i}"]`);
  if (genValue) genValue.addEventListener('input', () => entry.generic.value = genValue.value);
}
function renderSwitchValueRows(box, entry, i){
  const holder = box.querySelector(`#swValueRows-${i}`);
  if (!holder) return;
  const codes = Object.keys(entry.switchValues||{});
  holder.innerHTML = codes.map(code => `
    <div style="display:flex; align-items:center; gap:10px; font-size:13.5px;">
      <span style="min-width:90px; color:var(--text-dim);">${code}</span>
      <select class="sw-val" data-idx="${i}" data-code="${code}">
        <option value="true" ${entry.switchValues[code]===true?'selected':''}>ເປີດ</option>
        <option value="false" ${entry.switchValues[code]===false?'selected':''}>ປິດ</option>
      </select>
    </div>
  `).join('');
  holder.querySelectorAll('.sw-val').forEach(sel => {
    sel.addEventListener('change', () => { entry.switchValues[sel.dataset.code] = sel.value === 'true'; });
  });
}

function openModal(){
  document.getElementById('modalTitle').textContent = 'ສ້າງກົດໃໝ່';
  document.getElementById('ruleName').value = '';
  document.getElementById('triggerValue').value = '';
  setTriggerType('device');
  populateTriggerDeviceSelect();
  STATE.editingActions = [];
  if (STATE.devices.length) addActionBlock();
  else renderActionsContainer();
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('newRuleBtn').addEventListener('click', openModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id==='overlay') closeModal(); });

document.getElementById('saveRuleBtn').addEventListener('click', async () => {
  const name = document.getElementById('ruleName').value.trim();
  if (!name){ toast('ຕ້ອງໃສ່ຊື່ກົດ', true); return; }
  if (STATE.editingActions.length === 0){ toast('ຕ້ອງມີຢ່າງໜ້ອຍ 1 action', true); return; }

  let trigger_type, trigger_config;
  if (currentTriggerType === 'device'){
    const tid = document.getElementById('triggerDevice').value;
    const code = document.getElementById('triggerCode').value;
    const op = document.getElementById('triggerOp').value;
    const rawVal = document.getElementById('triggerValue').value.trim();
    if (!tid || !code || !rawVal){ toast('ຕ້ອງໃສ່ຂໍ້ມູນ trigger ໃຫ້ຄົບ', true); return; }
    trigger_type = 'device_state';
    trigger_config = { device_tuya_id: tid, code, op, value: parseTriggerValue(rawVal) };
  } else {
    const time = document.getElementById('scheduleTime').value;
    const repeat = document.getElementById('scheduleRepeat').value;
    if (!time){ toast('ຕ້ອງໃສ່ໂມງ', true); return; }
    trigger_type = 'schedule';
    trigger_config = { time, repeat };
  }

  const actionsPayload = [];
  for (const entry of STATE.editingActions){
    const dev = deviceByTuyaId(entry.targetTuyaId);
    if (!dev){ toast('ອຸປະກອນ action ບໍ່ຖືກຕ້ອງ', true); return; }
    let command;
    if (dev.category === 'infrared_ac'){
      const cmds = [];
      if (entry.ac.power !== '') cmds.push({ code:'power', value: Number(entry.ac.power) });
      if (entry.ac.temp !== '') cmds.push({ code:'temp', value: Number(entry.ac.temp) });
      if (entry.ac.fan !== '') cmds.push({ code:'fan', value: Number(entry.ac.fan) });
      if (entry.ac.mode !== '') cmds.push({ code:'mode', value: Number(entry.ac.mode) });
      command = { type:'ac', commands: cmds };
    } else if (entry.switchValues && Object.keys(entry.switchValues).length){
      command = { type:'switch', codes: Object.entries(entry.switchValues).map(([code,value]) => ({code,value})) };
    } else if (entry.generic && entry.generic.code){
      command = { type:'generic', codes: [{ code: entry.generic.code, value: parseTriggerValue(entry.generic.value) }] };
    } else {
      toast('ຕ້ອງຕັ້ງຄ່າ action ໃຫ້ຄົບຢ່າງໜ້ອຍ 1 ອຸປະກອນ', true);
      return;
    }
    actionsPayload.push({ target_device_id: dev.id, command });
  }

  try{
    const { data: ruleRow, error: ruleErr } = await sb.from('automation_rules')
      .insert({ name, trigger_type, trigger_config, enabled: true })
      .select().single();
    if (ruleErr) throw ruleErr;

    const rows = actionsPayload.map((a, idx) => ({
      rule_id: ruleRow.id, target_device_id: a.target_device_id, command: a.command,
      delay_seconds: 0, sort_order: idx,
    }));
    const { error: actErr } = await sb.from('automation_actions').insert(rows);
    if (actErr) throw actErr;

    toast('ບັນທຶກກົດແລ້ວ');
    closeModal();
    loadAll();
  }catch(e){
    toast('ບັນທຶກລົ້ມເຫຼວ: ' + (e.message||e), true);
  }
});
function parseTriggerValue(raw){
  if (raw === 'true') return true;
  if (raw === 'false') return false;
  const n = Number(raw);
  if (!Number.isNaN(n) && raw !== '') return n;
  return raw;
}

loadAll();
</script>
</body>
</html>
